name: Atualizar Cardápio Automaticamente

on:
  # Disparo principal: o Worker do Cloudflare (pasta worker/) chama este workflow
  # assim que aparece um PDF novo no site da UFCA.
  workflow_dispatch:

  # Reserva, caso o Worker falhe. O cron do GitHub atrasa e às vezes pula execuções,
  # por isso não é o mecanismo principal. (UTC → Brasília: -3 h)
  schedule:
    - cron: '17 11,21 * * *'   # todo dia, ~08h e ~18h de Brasília

permissions:
  contents: write

# Nunca roda duas atualizações ao mesmo tempo (evita conflito no push)
concurrency:
  group: atualizar-cardapio
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o Scraper
        run: python scraper.py

      - name: Commit e Push (se houver alterações)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html cardapio.json

          if ! git diff --staged --quiet; then
            echo "Alterações detectadas. Fazendo commit e push..."
            git commit -m "Atualiza cardápio da semana"
            git pull --rebase
            git push
          else
            echo "Nenhuma alteração detectada. O cardápio já estava em dia."
          fi
